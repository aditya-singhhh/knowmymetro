name: Recordings report (encrypted)
# Summarises recent trip recordings. The repo is public, so the report is encrypted with the
# given public key and pushed to the `reports-enc` branch; only the key holder can read it.
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: 'base64 of an RSA public key (PEM)'
        required: true
      limit:
        description: 'how many recent recordings'
        default: '20'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: functions
      - name: Build report
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          npx tsx tools/recordings-report.ts "${{ inputs.limit }}" 2>&1 | tail -3
      - name: Encrypt and push
        env:
          PUB: ${{ inputs.pubkey }}
        run: |
          set -e
          echo "$PUB" | base64 -d > "$RUNNER_TEMP/pub.pem"
          tar czf "$RUNNER_TEMP/r.tgz" -C functions reports
          openssl rand -out "$RUNNER_TEMP/k" 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/r.tgz" -out "$RUNNER_TEMP/report.bin" -pass "file:$RUNNER_TEMP/k"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -in "$RUNNER_TEMP/k" -out "$RUNNER_TEMP/key.bin"
          rm -rf functions/reports "$RUNNER_TEMP/r.tgz" "$RUNNER_TEMP/k" "$RUNNER_TEMP/sa.json"
          git config user.name "report-bot"; git config user.email "report-bot@users.noreply.github.com"
          git checkout --orphan reports-enc
          git rm -rfq .
          cp "$RUNNER_TEMP/report.bin" "$RUNNER_TEMP/key.bin" .
          git add report.bin key.bin
          git commit -qm "Encrypted recordings report"
          git push -fq origin reports-enc
          echo "::notice title=Report::pushed $(stat -c %s report.bin) bytes"
