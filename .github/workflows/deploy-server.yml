name: Deploy server (Firebase)
# Deploys Firestore/Storage rules and Cloud Functions to the knowmymetro project.
# Needs repository secret FIREBASE_SERVICE_ACCOUNT (the JSON key of a service account).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['functions/**', 'shared/**', 'data/**', 'firestore.rules', 'storage.rules', 'firebase.json']

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm test
      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          npx --yes firebase-tools@14 deploy --only functions,firestore,storage --project knowmymetro --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/deploy.log"
      - name: Report errors as annotations
        if: failure()
        run: |
          grep -iE "error|denied|permission|not enabled|failed|HTTP" "$RUNNER_TEMP/deploy.log" | tail -20 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          tail -15 "$RUNNER_TEMP/deploy.log" | while IFS= read -r line; do echo "::warning::${line//%/%25}"; done
