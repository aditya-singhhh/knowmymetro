name: Ship app update (over the air)
# Sends JavaScript/asset changes to installed apps without a store release.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'preview or production'
        required: true
        default: preview
        type: choice
        options: [preview, production]
      message:
        description: 'What changed'
        required: true
        default: 'Improvements'

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: .
      - run: eas init --non-interactive --force
      - run: eas update --channel ${{ inputs.channel }} --message "${{ inputs.message }}" --non-interactive
