name: Build Android app (EAS)
# Builds an installable Android app on Expo's servers. Run it from the Actions tab.
# Needs repository secret EXPO_TOKEN (expo.dev -> Account settings -> Access tokens).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'preview = installable APK for testing, production = Play Store bundle'
        required: true
        default: preview
        type: choice
        options: [preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: .
      - name: Link Expo project (first run creates it)
        run: eas init --non-interactive --force
      - name: Configure over-the-air updates
        run: eas update:configure --non-interactive || true
      - name: Build (waits for Expo's servers, ~15-20 min)
        run: |
          set -o pipefail
          eas build --platform android --profile ${{ inputs.profile }} --non-interactive --json 2>"$RUNNER_TEMP/build.err" | tee "$RUNNER_TEMP/build.json"
      - name: Report build link
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          tmp = os.environ['RUNNER_TEMP']
          try:
              for b in json.load(open(f'{tmp}/build.json')):
                  print(f"::notice title=Build {b.get('status')}::https://expo.dev/accounts/{b['project']['ownerAccount']['name']}/projects/{b['project']['slug']}/builds/{b['id']}")
                  if b.get('artifacts', {}).get('buildUrl'): print(f"::notice title=Download::{b['artifacts']['buildUrl']}")
                  if b.get('error'): print(f"::error::{b['error'].get('message')}")
          except Exception as e:
              print(f"::warning::no build json ({e})")
          for line in open(f'{tmp}/build.err').read().splitlines()[-25:]:
              if line.strip(): print(f"::warning::{line[:300]}")
          PY
