name: Health check
# Calls the live planner with a real trip and lists the latest app builds.
on:
  workflow_dispatch:

jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - name: Plan JP Nagar -> Hoodi
        run: |
          DATE=$(TZ=Asia/Kolkata date -d tomorrow +%Y%m%d)
          set +e
          curl -sS -X POST https://asia-south1-knowmymetro.cloudfunctions.net/planTrip \
            -H 'Content-Type: application/json' \
            -d "{\"data\":{\"from\":\"JPN\",\"to\":\"DKIA\",\"date\":\"$DATE\",\"time\":\"09:30\",\"mode\":\"by\",\"priority\":\"all\"}}" -o plan.json -w "%{http_code}" > code.txt 2> curl.err
          echo "::notice title=curl::exit $? http $(cat code.txt) $(head -c 200 curl.err)"
          touch plan.json
          python3 - <<'PY'
          import json
          code = open('code.txt').read()
          try:
              d = json.load(open('plan.json'))
          except Exception:
              print(f"::error title=Planner HTTP {code}::{open('plan.json').read()[:300]}"); raise SystemExit(1)
          if 'result' not in d:
              print(f"::error title=Planner HTTP {code}::{json.dumps(d)[:300]}"); raise SystemExit(1)
          r = d['result']
          if r.get('error'): print(f"::warning title=Planner said::{r['error']}")
          for o in r.get('options', [])[:3]:
              fmt = lambda s: f"{s//3600:02d}:{s%3600//60:02d}"
              legs = ' | '.join(f"{fmt(l['dep'])} {l['from']}>{l['to']}" for l in o['legs'])
              print(f"::notice title=Option (stand {o['standMinutes']} min, fare {o['fare']})::{legs} -> {fmt(o['arr'])}")
          PY
  builds:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: .
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Latest builds
        run: |
          eas init --non-interactive --force > /dev/null 2>&1 || true
          eas build:list --limit 3 --json --non-interactive > builds.json 2> list.err || true
          tail -5 list.err | while IFS= read -r l; do echo "::warning::$l"; done
          python3 - <<'PY'
          import json
          try: builds = json.load(open('builds.json'))
          except Exception as e: print(f"::warning::could not list builds ({e})"); builds = []
          for b in builds:
              url = (b.get('artifacts') or {}).get('buildUrl') or ''
              err = (b.get('error') or {}).get('message') or ''
              print(f"::notice title=Build {b.get('status')} ({b.get('buildProfile')})::{url or b.get('id')}")
              if err: print(f"::error title=Build error::{err[:900]}")
              if b.get('status') == 'ERRORED':
                  import re
                  for n, u in enumerate(b.get('logFiles') or []):
                      import subprocess
                      subprocess.run(['curl', '-sSL', '--compressed', '-o', f'log{n}', u])
                      head = open(f'log{n}', 'rb').read(8)
                      print(f"::notice title=log file {n}::{subprocess.run(['file', f'log{n}'], capture_output=True, text=True).stdout.strip()} {head.hex()}")
                      raw = open(f'log{n}', 'rb').read()
                      for dec in ('gzip -dc', 'zstd -dc', 'brotli -dc', 'xz -dc'):
                          r = subprocess.run(f'{dec} log{n}', shell=True, capture_output=True)
                          if r.returncode == 0 and r.stdout: raw = r.stdout; print(f"::notice::decoded with {dec}"); break
                      if raw[:3] != b'{"n' and b'ustar' in raw[:600]:
                          import tarfile, io
                          t = tarfile.open(fileobj=io.BytesIO(raw)); raw = b''.join(t.extractfile(m).read() for m in t.getmembers() if m.isfile())
                      txt = raw.decode('utf8', 'replace')
                      lines = []
                      for line in txt.splitlines():
                          try: msg = json.loads(line).get('msg', line)
                          except Exception: msg = line
                          lines.append(str(msg))
                      hits = [i for i, l in enumerate(lines) if not l.startswith('WARNING') and re.search(r'^e: |error:|FAILURE|What went wrong|Unresolved reference|Unable to resolve|Cannot find', l)]
                      shown = set()
                      for i in hits[-12:]:
                          for j in range(max(0, i - 1), min(len(lines), i + 4)):
                              if j in shown: continue
                              shown.add(j); print(f"::error title=log {j}::{lines[j][:600]}")
                      for l in lines[-8:]: print(f"::warning title=log tail::{l[:600]}")
                  break
          PY
