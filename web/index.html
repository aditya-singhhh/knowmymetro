<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KnowMyMetro</title>
<meta name="description" content="Namma Metro trips planned for a seat: which train, which coach, where to change.">
<meta name="theme-color" content="#7B2268">
<style>
:root{--bg:#F2F2F7;--card:#fff;--ink:#101014;--ink2:#6B6B72;--tint:#7B2268}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1F;--ink:#F4F4F6;--ink2:#9C9CA4;--tint:#E08BCF;color-scheme:dark}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:48px 16px;display:flex;flex-direction:column;gap:16px}
h1{font-size:34px;line-height:1.1;margin:0;color:var(--tint)}
p{margin:0;color:var(--ink2)}
.card{background:var(--card);border-radius:18px;padding:18px}
</style>
</head>
<body>
<main>
  <h1>KnowMyMetro</h1>
  <p>Namma Metro trips planned for a seat: which train, which coach for a quick change, and where your train is right now.</p>
  <div class="card"><p>The Android app is in early testing. Ask a friend who uses it for an invite.</p></div>
</main>
</body>
</html>
